<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olahtubuh</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #17181a;
    --surface2: #1f2023;
    --border: #2a2b2e;
    --text: #eceef0;
    --text-dim: #8a8d93;
    --accent: #6ee7b7;
    --accent-dim: #2c4a3d;
    --danger: #f87171;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  button { font-family: inherit; }
  header {
    padding: 20px 16px 12px; position: sticky; top: 0; background: var(--bg);
    z-index: 5; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; letter-spacing: 0.2px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface);
    color: var(--text-dim); font-size: 13px; border: 1px solid var(--border); white-space: nowrap;
  }
  .tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
  .view-toggle { display: flex; gap: 6px; margin-top: 10px; }
  .view-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .view-toggle button.active { color: var(--text); border-color: var(--accent-dim); }
  main { padding: 16px; padding-bottom: 150px; max-width: 560px; margin: 0 auto; }
  .date-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .date-row input { background: transparent; color: var(--accent); border: none; font-size: 12px; font-family: inherit; }
  .link-btn { background: none; border: none; color: var(--text-dim); font-size: 12px; text-decoration: underline; padding: 4px 0; }
  .exercise-card, .edit-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .exercise-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .exercise-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .sets-grid { display: flex; flex-direction: column; gap: 6px; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 24px; gap: 8px; align-items: center; }
  .set-row .idx { font-size: 11px; color: var(--text-dim); text-align: center; }
  .set-row input[type=number] {
    width: 100%; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; text-align: center;
  }
  .set-row input:focus, .edit-field input:focus { outline: none; border-color: var(--accent-dim); }
  .set-row .done { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); padding: 0; }
  .set-row .done.checked { background: var(--accent); border-color: var(--accent); }
  .set-actions { display: flex; gap: 14px; margin-top: 8px; }
  .set-actions button { font-size: 11px; color: var(--text-dim); background: none; border: none; padding: 4px 0; }
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
  }
  .timer-row {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 560px; margin: 0 auto 8px; padding: 0 4px; font-size: 12px; color: var(--text-dim);
  }
  #timerVal { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: var(--text-dim); }
  #timerVal.live { color: var(--accent); }
  .save-btn {
    width: 100%; max-width: 560px; margin: 0 auto; display: block; padding: 14px;
    border-radius: 12px; border: none; background: var(--accent); color: #06251a; font-weight: 700; font-size: 14px;
  }
  .save-btn:active { opacity: 0.85; }
  .history-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .history-entry .hd { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; gap: 8px; }
  .history-entry .hd .day-tag { color: var(--accent); }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--text); }
  .history-entry table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-entry td { padding: 3px 0; color: var(--text); }
  .history-entry .del { color: var(--danger); font-size: 11px; background: none; border: none; padding: 4px 0; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; line-height: 1.6; }
  .primary-link { margin-top: 10px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent-dim); background: var(--accent-dim); color: var(--accent); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar button {
    flex: 1; padding: 10px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .edit-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .edit-row:last-child { margin-bottom: 0; }
  .edit-row label { font-size: 10px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .edit-field { flex: 1; min-width: 0; }
  .edit-field input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .sets-field { max-width: 64px; flex: none; }
  .icon-btn {
    width: 32px; height: 34px; border-radius: 8px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; flex: none; margin-top: 18px; padding: 0;
  }
  .icon-btn.danger { color: var(--danger); font-size: 16px; }
  .drag-handle {
    width: 44px; display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .drag-handle:focus-visible { outline: 2px solid var(--accent-dim); }
  .edit-card.dragging {
    position: relative; z-index: 4; transition: none; cursor: grabbing;
    border-color: var(--accent); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
  }
  body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .bw-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .bw-card.needs { border-color: var(--accent-dim); }
  .bw-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bw-title { font-size: 14px; font-weight: 600; }
  .bw-note { font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .bw-input { display: flex; align-items: center; gap: 6px; flex: none; color: var(--text-dim); font-size: 12px; }
  .bw-input input {
    width: 84px; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 14px; text-align: center; font-family: inherit;
  }
  .bw-input input:focus { outline: none; border-color: var(--accent-dim); }
  .edit-row label.bw-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); margin: 0; width: 100%; }
  .bw-toggle input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
  .bw-toggle small { color: var(--text-dim); font-size: 10px; margin-left: auto; text-align: right; }
  .chip.dim { color: var(--text-dim); }
  .history-entry .hd { flex-wrap: wrap; row-gap: 4px; }
  .edit-hint { font-size: 11px; color: var(--text-dim); margin: 0 2px 10px; }
  .day-actions { display: flex; gap: 8px; margin-top: 10px; }
  .day-actions button {
    flex: 1; padding: 9px; border-radius: 10px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .day-actions button.danger { color: var(--danger); }
  .add-ex-btn {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-dim); font-size: 13px; margin-bottom: 10px;
  }
  .subtabs, .metric-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .subtabs button, .metric-toggle button {
    flex: 1; padding: 9px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .subtabs button.active, .metric-toggle button.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }
  .ex-select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; margin-bottom: 10px;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 10px; margin-bottom: 10px; overflow-x: auto;
  }
  .chart-card svg { display: block; max-width: none; }
  .chart-split { display: flex; overflow: hidden; }
  .chart-y { flex: none; }
  .chart-scroll { flex: 1; min-width: 0; overflow-x: auto; }
  .chart-axis-label { fill: var(--text-dim); font-size: 9px; font-family: inherit; }
  .chart-grid { stroke: var(--border); stroke-width: 1; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .chart-point { fill: var(--accent); }
  .chart-value { fill: var(--text); font-size: 9px; font-family: inherit; text-anchor: middle; }
  .chart-stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .chart-stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
  .chart-stat .v { font-size: 16px; font-weight: 700; color: var(--accent); }
  .chart-stat .l { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>Olahtubuh</h1>
  <div class="view-toggle">
    <button id="btnLog" class="active">Log</button>
    <button id="btnEdit">Edit</button>
    <button id="btnHistory">History</button>
  </div>
</header>

<main>
  <div id="logView">
    <div class="date-row">
      <span>Date <input type="date" id="dateInput"></span>
      <button class="link-btn" id="clearBtn">Clear log</button>
    </div>
    <div class="bw-card" id="bwCard">
      <div class="bw-main">
        <div>
          <div class="bw-title">Bodyweight</div>
          <div class="bw-note" id="bwNote"></div>
        </div>
        <div class="bw-input"><input type="number" inputmode="decimal" step="0.1" min="0" id="bwInput" aria-label="Bodyweight in kg"><span>kg</span></div>
      </div>
    </div>
    <div id="exerciseList"></div>
  </div>

  <div id="editView" style="display:none">
    <div class="edit-hint" id="editHint">Drag the grip on a card to reorder.</div>
    <div id="editList"></div>
    <button class="add-ex-btn" id="addExBtn">+ Add exercise</button>
  </div>

  <div id="historyView" style="display:none">
    <div class="subtabs">
      <button id="hEntries" class="active">Entries</button>
      <button id="hProgress">Progress</button>
      <button id="hSessions">Sessions</button>
      <button id="hBody">Body</button>
    </div>
    <div id="entriesPane">
      <div class="toolbar">
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <div id="historyList"></div>
    </div>
    <div id="progressPane" style="display:none">
      <select class="ex-select" id="exerciseSelect"></select>
      <div class="metric-toggle">
        <button id="mTop" class="active">Top weight</button>
        <button id="mVol">Volume</button>
      </div>
      <div id="progressChart"></div>
    </div>
    <div id="sessionsPane" style="display:none">
      <div id="sessionsChart"></div>
    </div>
    <div id="bodyPane" style="display:none">
      <div id="bodyChart"></div>
    </div>
  </div>
</main>

<footer class="save-bar" id="saveBar">
  <div class="timer-row"><span id="timerLabel">Timer starts on first log</span><span id="timerVal">00:00</span></div>
  <button class="save-btn" id="saveBtn">Save Session</button>
</footer>

<datalist id="exNames"></datalist>

<script>
const KEYS = { plan: "olahtubuh_plan_v2", draft: "olahtubuh_draft_v2", history: "ppl_log_history_v1" };
const OLD_KEYS = { plan: "olahtubuh_plan_v1", draft: "olahtubuh_draft_v1" };
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").trim().toLowerCase();
const blank = () => ({ w: "", r: "", done: false });
const exName = ex => (ex.name || "").trim() || "Untitled exercise";
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

let warned = false;
function read(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
function write(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) {
    if (!warned) { warned = true; alert("Could not save. Browser storage may be full or blocked."); }
    return false;
  }
}

function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60, p = n => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function fmtNum(v) { return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function fmtLabel(iso) { const [, m, d] = iso.split("-"); return `${+d} ${MONTHS[+m - 1]}`; }

/* ---------- state ---------- */
// One flat workout list. Old per-day plans are merged into it once; the old keys are left untouched as a backup.
function collapsePlan(p) {
  const ex = [];
  if (p && Array.isArray(p.days)) p.days.forEach(d => (d.exercises || []).forEach(e => ex.push(e)));
  return { days: [{ id: uid(), name: "Workout", exercises: ex }] };
}
let plan = read(KEYS.plan, null);
if (!plan || !Array.isArray(plan.days) || !plan.days.length) {
  plan = collapsePlan(read(OLD_KEYS.plan, null));
  write(KEYS.plan, plan);
}
if (plan.days.length > 1) { plan = collapsePlan(plan); write(KEYS.plan, plan); }
let draft = read(KEYS.draft, null);
if (!draft || typeof draft.days !== "object" || !draft.days) {
  draft = { days: {} };
  const old = read(OLD_KEYS.draft, null);
  if (old && old.days) {
    const merged = { date: todayStr(), startedAt: null, sets: {} };
    let any = false;
    Object.values(old.days).forEach(d => {
      if (!d) return;
      Object.assign(merged.sets, d.sets || {});
      if (d.startedAt && (!merged.startedAt || d.startedAt < merged.startedAt)) merged.startedAt = d.startedAt;
      if (d.date) merged.date = d.date;
      any = true;
    });
    if (any) draft.days[plan.days[0].id] = merged;
  }
  write(KEYS.draft, draft);
}
Object.keys(draft.days).forEach(id => { if (!plan.days.some(d => d.id === id)) delete draft.days[id]; });

const currentDayId = plan.days[0].id;
let histTab = "entries";
let metric = "top";

const savePlan = () => write(KEYS.plan, plan);
const saveDraft = () => write(KEYS.draft, draft);
const loadHistory = () => { const h = read(KEYS.history, []); return Array.isArray(h) ? h : []; };
const currentDay = () => plan.days.find(d => d.id === currentDayId) || plan.days[0];

function dayDraft(dayId) {
  if (!draft.days[dayId]) draft.days[dayId] = { date: todayStr(), startedAt: null, sets: {}, bw: "" };
  return draft.days[dayId];
}
function hasData(d) {
  return Object.values(d.sets || {}).some(arr => arr.some(s => s.w !== "" || s.r !== "" || s.done));
}
function ensureSets(day) {
  const d = dayDraft(day.id);
  day.exercises.forEach(ex => {
    if (!d.sets[ex.id]) d.sets[ex.id] = [];
    while (d.sets[ex.id].length < ex.sets) d.sets[ex.id].push(blank());
  });
  return d;
}
function startTimer(d) {
  if (!d.startedAt) { d.startedAt = Date.now(); updateTimer(); }
}

/* ---------- history helpers ---------- */
function chrono() { return loadHistory().slice().reverse().sort((a, b) => String(a.date).localeCompare(String(b.date))); }
function exerciseIndex() {
  const m = new Map();
  chrono().forEach(h => (h.exercises || []).forEach(ex => m.set(norm(ex.name), ex.name)));
  return Array.from(m.entries()).sort((a, b) => a[1].localeCompare(b[1]));
}
function numOf(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }
// Real load of each counted set. Bodyweight exercises: bodyweight + added weight (added may be blank or negative).
function exLoads(ex, bodyweight) {
  const bwv = numOf(bodyweight);
  const bw = bwv !== null && bwv > 0 ? bwv : 0;
  const out = [];
  (ex.sets || []).forEach(s => {
    const w = numOf(s.w), r = numOf(s.r), reps = r !== null && r > 0 ? r : 0;
    let load;
    if (ex.bw) {
      if (!reps && !s.done && w === null) return;
      load = bw + (w || 0);
    } else {
      if (w === null || !(w > 0)) return;
      load = w;
    }
    if (load > 0) out.push({ load, reps, w: s.w, r: s.r });
  });
  return out;
}
// Most recent bodyweight on or before a date (entered or carried forward from an earlier session).
function lastBodyweight(onOrBefore) {
  const list = chrono();
  for (let i = list.length - 1; i >= 0; i--) {
    const h = list[i];
    if (onOrBefore && String(h.date) > onOrBefore) continue;
    const v = numOf(h.bodyweight);
    if (v !== null && v > 0) return { value: v, date: h.date };
  }
  return null;
}
function lastTop(name) {
  const key = norm(name);
  for (const h of loadHistory()) {
    const ex = (h.exercises || []).find(e => norm(e.name) === key);
    if (!ex) continue;
    let best = null;
    (ex.sets || []).forEach(set => {
      const one = exLoads({ bw: ex.bw, sets: [set] }, h.bodyweight)[0];
      if (one && (!best || one.load > best.load)) best = { load: one.load, w: set.w, r: set.r, bw: !!ex.bw };
    });
    if (best) return best;
  }
  return null;
}
function progressPoints(key, kind) {
  const pts = [];
  chrono().forEach(h => {
    const ex = (h.exercises || []).find(e => norm(e.name) === key);
    if (!ex) return;
    const loads = exLoads(ex, h.bodyweight);
    let value = 0;
    if (kind === "top") value = loads.length ? Math.max(...loads.map(l => l.load)) : 0;
    else loads.forEach(l => { value += l.load * l.reps; });
    if (value > 0) pts.push({ label: fmtLabel(h.date), value });
  });
  return pts;
}
function isBodyweightExercise(key) {
  return chrono().some(h => (h.exercises || []).some(e => norm(e.name) === key && e.bw));
}
function addedText(w) {
  const a = numOf(w) || 0;
  return a ? `BW ${a > 0 ? "+" : "-"} ${fmtNum(Math.abs(a))}` : "BW";
}
function setText(ex, s, bodyweight) {
  const reps = esc(s.r || "-");
  if (!ex.bw) return `${esc(s.w || "-")} kg x ${reps}`;
  const bwv = numOf(bodyweight);
  const tag = addedText(s.w);
  return (bwv > 0 ? `${fmtNum(bwv + (numOf(s.w) || 0))} kg (${tag})` : tag) + ` x ${reps}`;
}
function refreshDatalist() {
  const names = new Set();
  exerciseIndex().forEach(([, n]) => names.add(n));
  plan.days.forEach(d => d.exercises.forEach(e => { if ((e.name || "").trim()) names.add(e.name.trim()); }));
  $("exNames").innerHTML = Array.from(names).sort().map(n => `<option value="${esc(n)}"></option>`).join("");
}

/* ---------- log view ---------- */
function planHasBw() { return plan.days.some(day => day.exercises.some(e => e.bw)); }
function currentBW(d) {
  const entered = numOf(d.bw);
  if (entered !== null && entered > 0) return entered;
  const last = lastBodyweight(d.date || todayStr());
  return last ? last.value : null;
}
function bwLoadText(d) {
  const v = currentBW(d);
  return v ? `load = ${fmtNum(v)} kg + added` : "bodyweight not set";
}
function renderBW(d) {
  const entered = numOf(d.bw);
  const has = entered !== null && entered > 0;
  const last = lastBodyweight(d.date || todayStr());
  const inp = $("bwInput");
  if (document.activeElement !== inp) inp.value = d.bw || "";
  inp.placeholder = last ? fmtNum(last.value) : "kg";
  let note;
  if (has) note = "Saved with this session.";

$("saveBtn").onclick = () => {
  const day = currentDay();
  const d = dayDraft(day.id);
  const exercises = day.exercises.map(ex => {
    const out = {
      name: exName(ex),
      sets: (d.sets[ex.id] || []).filter(s => s.w !== "" || s.r !== "" || s.done).map(s => ({ w: s.w, r: s.r, done: s.done }))
    };
    if (ex.bw) out.bw = true;
    return out;
  }).filter(ex => ex.sets.length > 0);
  if (!exercises.length) { alert("Log at least one set before saving."); return; }
  const date = d.date || todayStr();
  // bodyweight: what was entered, otherwise carry over the previous one
  const entered = numOf(d.bw);
  const hasEntered = entered !== null && entered > 0;
  const prevBw = lastBodyweight(date);
  const bodyweight = hasEntered ? entered : (prevBw ? prevBw.value : null);
  if (exercises.some(e => e.bw) && !bodyweight &&
      !confirm("No bodyweight entered yet, so bodyweight exercises will only count the added weight. Save anyway?")) return;
  const duration = d.startedAt ? Math.max(1, Math.round((Date.now() - d.startedAt) / 1000)) : null;
  const hist = loadHistory();
  const entry = { id: uid(), date, day: "Workout", exercises, duration, bodyweight: bodyweight || null };
  if (bodyweight && !hasEntered) entry.bwAssumed = true;
  hist.unshift(entry);
  if (!write(KEYS.history, hist)) return;
  delete draft.days[day.id];
  saveDraft();
  refreshDatalist();
  renderLog();
  $("saveBtn").textContent = duration ? `Saved (${fmtDur(duration)})` : "Saved";
  setTimeout(() => { $("saveBtn").textContent = "Save Session"; }, 2000);

/* ---------- drag to reorder ---------- */
let drag = null;
function persistOrder() {
  const day = currentDay();
  const byId = new Map(day.exercises.map(x => [x.id, x]));
  const next = Array.from($("editList").children).map(c => byId.get(c.dataset.ex)).filter(Boolean);
  if (next.length === day.exercises.length) { day.exercises = next; savePlan(); }

function flipMove(sib, fn) {
  const before = sib.getBoundingClientRect().top;
  fn();
  const delta = before - sib.getBoundingClientRect().top;
  if (!delta) return;
  sib.style.transition = "none";
  sib.style.transform = `translateY(${delta}px)`;
  sib.getBoundingClientRect();
  sib.style.transition = "transform 150ms ease";
  sib.style.transform = "";
}
// Never re-insert the dragged card itself: moving the node that holds the pointer capture releases it
// and ends the drag. Swaps always move the neighbour to the other side of the card instead.
function dragUpdate() {
  const card = drag.card, list = $("editList");
  card.style.transform = "none";
  let rect = card.getBoundingClientRect();
  const center = drag.y - drag.grab + rect.height / 2;
  for (let guard = 0; guard < 100; guard++) {
    const prev = card.previousElementSibling, next = card.nextElementSibling;
    let moved = false;
    if (prev) { const r = prev.getBoundingClientRect(); if (center < r.top + r.height / 2) { flipMove(prev, () => list.insertBefore(prev, card.nextSibling)); moved = true; } }
    if (!moved && next) { const r = next.getBoundingClientRect(); if (center > r.top + r.height / 2) { flipMove(next, () => list.insertBefore(next, card)); moved = true; } }
    if (!moved) break;
    card.style.transform = "none";
    rect = card.getBoundingClientRect();
  }
  card.style.transform = `translateY(${drag.y - drag.grab - rect.top}px)`;
}
function dragTick() {
  if (!drag) return;
  const topEdge = 130, bottomEdge = window.innerHeight - 70;
  let dy = 0;
  if (drag.y < topEdge) dy = -Math.min(18, (topEdge - drag.y) / 4 + 2);
  else if (drag.y > bottomEdge) dy = Math.min(18, (drag.y - bottomEdge) / 4 + 2);
  if (dy) { window.scrollBy(0, dy); dragUpdate(); }
  drag.raf = requestAnimationFrame(dragTick);
}
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  d.card.style.transform = "";
  d.card.classList.remove("dragging");
  document.body.classList.remove("is-dragging");
  try { d.h.releasePointerCapture(d.pid); } catch (_) {}
  persistOrder();
}
$("editList").addEventListener("pointerdown", e => {
  const h = e.target.closest(".drag-handle");
  if (!h || drag) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const card = h.closest(".edit-card");
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { card, h, pid: e.pointerId, y: e.clientY, grab: e.clientY - card.getBoundingClientRect().top, raf: 0 };
  card.classList.add("dragging");
  document.body.classList.add("is-dragging");
  drag.raf = requestAnimationFrame(dragTick);
});
$("editList").addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.y = e.clientY;
  dragUpdate();
});
["pointerup", "pointercancel", "lostpointercapture"].forEach(t =>
  $("editList").addEventListener(t, e => { if (drag && e.pointerId === drag.pid) endDrag(); }));
$("editList").addEventListener("contextmenu", e => { if (e.target.closest(".drag-handle")) e.preventDefault(); });
// keyboard fallback: focus the grip and press Up / Down
$("editList").addEventListener("keydown", e => {
  const h = e.target.closest(".drag-handle");
  if (!h || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const card = h.closest(".edit-card"), list = $("editList");
  if (e.key === "ArrowUp" && card.previousElementSibling) list.insertBefore(card, card.previousElementSibling);
  else if (e.key === "ArrowDown" && card.nextElementSibling) list.insertBefore(card.nextElementSibling, card);
  else return;
  h.focus();
  persistOrder();
});

// The weight scale (left) is its own fixed column; only the plot scrolls sideways, so the scale stays visible
// however many sessions there are. Plot is drawn 1:1 in pixels so text never shrinks.
function buildChart(points, fmtY) {
  const n = points.length;
  const h = 240, padT = 18, padB = 32, yW = 38, padX = 20;
  const mainW = (document.querySelector("main").clientWidth || 390) - 32;
  const avail = Math.max(200, mainW - 22 - yW); // card padding 2 x 10 + border 2 x 1
  const plotW = Math.max(avail, n * 36 + padX * 2);
  const ch = h - padT - padB;
  const vals = points.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => n > 1 ? padX + (i * (plotW - padX * 2)) / (n - 1) : plotW / 2;
  const y = v => padT + ch - ((v - lo) / (hi - lo)) * ch;
  let grid = "", ylab = "", plot = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4, yy = y(v);
    grid += `<line class="chart-grid" x1="0" y1="${yy}" x2="${plotW}" y2="${yy}"/>`;
    ylab += `<text class="chart-axis-label" x="${yW - 6}" y="${yy + 3}" text-anchor="end">${fmtY(v, hi - lo)}</text>`;
  }
  plot += `<path class="chart-line" d="${points.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.value)}`).join(" ")}"/>`;
  points.forEach((p, i) => {
    plot += `<circle class="chart-point" cx="${x(i)}" cy="${y(p.value)}" r="3.5"/>`;
    plot += `<text class="chart-value" x="${x(i)}" y="${y(p.value) - 9}">${fmtNum(Math.round(p.value * 10) / 10)}</text>`;
    plot += `<text class="chart-axis-label" x="${x(i)}" y="${h - 10}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<div class="chart-card chart-split">` +
    `<svg class="chart-y" width="${yW}" height="${h}" viewBox="0 0 ${yW} ${h}" xmlns="http://www.w3.org/2000/svg">${ylab}</svg>` +
    `<div class="chart-scroll"><svg class="chart-plot" width="${plotW}" height="${h}" viewBox="0 0 ${plotW} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${plot}</svg></div>` +
    `</div>`;
}
function statsHTML(items) {
  return `<div class="chart-stats">${items.map(i => `<div class="chart-stat"><div class="v">${i.v}</div><div class="l">${i.l}</div></div>`).join("")}</div>`;
}
function scrollChartsToEnd() { document.querySelectorAll(".chart-scroll").forEach(c => { c.scrollLeft = c.scrollWidth; }); }

function renderProgress() {

function renderProgressChart() {

function renderSessions() {

// Bodyweight over time: only weights you actually entered (assumed carry-overs are not new data).

    `<div class="exercise-meta" style="margin:0 2px 8px">Bodyweight (kg), entered values only</div>` +

  if (tab === "progress") renderProgress();
  if (tab === "sessions") renderSessions();
  if (tab === "body") renderBody();
}
$("hEntries").onclick = () => showHist("entries");
$("hProgress").onclick = () => showHist("progress");
$("hSessions").onclick = () => showHist("sessions");
$("hBody").onclick = () => showHist("body");
$("exerciseSelect").onchange = renderProgressChart;
$("mTop").onclick = () => { metric = "top"; $("mTop").classList.add("active"); $("mVol").classList.remove("active"); renderProgressChart(); };
$("mVol").onclick = () => { metric = "volume"; $("mVol").classList.add("active"); $("mTop").classList.remove("active"); renderProgressChart(); };

/* ---------- export / import ---------- */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 2, history: loadHistory(), plan }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `olahtubuh-export-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.history;
      if (!Array.isArray(incoming)) throw new Error("bad format");
      const existing = loadHistory();
      const ids = new Set(existing.map(h => String(h.id)));
      write(KEYS.history, existing.concat(incoming.filter(h => !ids.has(String(h.id)))));
      const planEmpty = plan.days.every(d => !d.exercises.length);
      if (!Array.isArray(data) && data.plan && Array.isArray(data.plan.days) && data.plan.days.length && planEmpty) {
        plan = collapsePlan(data.plan); savePlan();
      }
      refreshDatalist();
      renderHistory();
      alert("Import complete.");
    } catch (err) {
      alert("Could not read that file. Use an export from this app.");
    }
    $("importFile").value = "";
  };
  reader.readAsText(file);
};

/* ---------- navigation ---------- */
function showView(name) {
  $("btnLog").classList.toggle("active", name === "log");
  $("btnEdit").classList.toggle("active", name === "edit");
  $("btnHistory").classList.toggle("active", name === "history");
  $("logView").style.display = name === "log" ? "block" : "none";
  $("editView").style.display = name === "edit" ? "block" : "none";
  $("historyView").style.display = name === "history" ? "block" : "none";
  $("saveBar").style.display = name === "log" ? "block" : "none";
  if (name === "log") renderLog();
  if (name === "edit") renderEdit();
  if (name === "history") showHist(histTab);
}
$("btnLog").onclick = () => showView("log");
$("btnEdit").onclick = () => showView("edit");
$("btnHistory").onclick = () => showView("history");

/* ---------- init ---------- */
refreshDatalist();
showView("log");
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
