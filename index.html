<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olahtubuh</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #17181a;
    --surface2: #1f2023;
    --border: #2a2b2e;
    --text: #eceef0;
    --text-dim: #8a8d93;
    --accent: #6ee7b7;
    --accent-dim: #2c4a3d;
    --danger: #f87171;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  button { font-family: inherit; }
  header {
    padding: 20px 16px 12px; position: sticky; top: 0; background: var(--bg);
    z-index: 5; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; letter-spacing: 0.2px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface);
    color: var(--text-dim); font-size: 13px; border: 1px solid var(--border); white-space: nowrap;
  }
  .tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
  .view-toggle { display: flex; gap: 6px; margin-top: 10px; }
  .view-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .view-toggle button.active { color: var(--text); border-color: var(--accent-dim); }
  main { padding: 16px; padding-bottom: 150px; max-width: 560px; margin: 0 auto; }
  .date-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .date-row input { background: transparent; color: var(--accent); border: none; font-size: 12px; font-family: inherit; }
  .link-btn { background: none; border: none; color: var(--text-dim); font-size: 12px; text-decoration: underline; padding: 4px 0; }
  .exercise-card, .edit-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .exercise-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .exercise-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .sets-grid { display: flex; flex-direction: column; gap: 6px; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 24px; gap: 8px; align-items: center; }
  .set-row .idx { font-size: 11px; color: var(--text-dim); text-align: center; }
  .set-row input[type=number] {
    width: 100%; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; text-align: center;
  }
  .set-row input:focus, .edit-field input:focus { outline: none; border-color: var(--accent-dim); }
  .set-row .done { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); padding: 0; }
  .set-row .done.checked { background: var(--accent); border-color: var(--accent); }
  .set-actions { display: flex; gap: 14px; margin-top: 8px; }
  .set-actions button { font-size: 11px; color: var(--text-dim); background: none; border: none; padding: 4px 0; }
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
  }
  .timer-row {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 560px; margin: 0 auto 8px; padding: 0 4px; font-size: 12px; color: var(--text-dim);
  }
  #timerVal { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: var(--text-dim); }
  #timerVal.live { color: var(--accent); }
  .save-btn {
    width: 100%; max-width: 560px; margin: 0 auto; display: block; padding: 14px;
    border-radius: 12px; border: none; background: var(--accent); color: #06251a; font-weight: 700; font-size: 14px;
  }
  .save-btn:active { opacity: 0.85; }
  .history-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .history-entry .hd { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; gap: 8px; }
  .history-entry .hd .day-tag { color: var(--accent); }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--text); }
  .history-entry table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-entry td { padding: 3px 0; color: var(--text); }
  .history-entry .del { color: var(--danger); font-size: 11px; background: none; border: none; padding: 4px 0; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; line-height: 1.6; }
  .primary-link { margin-top: 10px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent-dim); background: var(--accent-dim); color: var(--accent); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar button {
    flex: 1; padding: 10px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .edit-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .edit-row:last-child { margin-bottom: 0; }
  .edit-row label { font-size: 10px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .edit-field { flex: 1; min-width: 0; }
  .edit-field input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .sets-field { max-width: 64px; flex: none; }
  .icon-btn {
    width: 32px; height: 34px; border-radius: 8px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; flex: none; margin-top: 18px; padding: 0;
  }
  .icon-btn.danger { color: var(--danger); font-size: 16px; }
  .day-actions { display: flex; gap: 8px; margin-top: 10px; }
  .day-actions button {
    flex: 1; padding: 9px; border-radius: 10px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .day-actions button.danger { color: var(--danger); }
  .add-ex-btn {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-dim); font-size: 13px; margin-bottom: 10px;
  }
  .subtabs, .metric-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .subtabs button, .metric-toggle button {
    flex: 1; padding: 9px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .subtabs button.active, .metric-toggle button.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }
  .ex-select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; margin-bottom: 10px;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 10px; margin-bottom: 10px; overflow-x: auto;
  }
  .chart-card svg { width: 100%; height: auto; display: block; }
  .chart-axis-label { fill: var(--text-dim); font-size: 9px; font-family: inherit; }
  .chart-grid { stroke: var(--border); stroke-width: 1; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .chart-point { fill: var(--accent); }
  .chart-value { fill: var(--text); font-size: 9px; font-family: inherit; text-anchor: middle; }
  .chart-stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .chart-stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
  .chart-stat .v { font-size: 16px; font-weight: 700; color: var(--accent); }
  .chart-stat .l { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>Olahtubuh</h1>
  <div class="tabs" id="tabs"></div>
  <div class="view-toggle">
    <button id="btnLog" class="active">Log</button>
    <button id="btnEdit">Edit</button>
    <button id="btnHistory">History</button>
  </div>
</header>

<main>
  <div id="logView">
    <div class="date-row">
      <span>Date <input type="date" id="dateInput"></span>
      <button class="link-btn" id="clearBtn">Clear log</button>
    </div>
    <div id="exerciseList"></div>
  </div>

  <div id="editView" style="display:none">
    <div class="edit-card">
      <div class="edit-row">
        <div class="edit-field">
          <label>Day name</label>
          <input type="text" id="dayName" autocomplete="off">
        </div>
      </div>
      <div class="day-actions">
        <button id="addDayBtn">+ Add day</button>
        <button id="delDayBtn" class="danger">Delete day</button>
      </div>
    </div>
    <div id="editList"></div>
    <button class="add-ex-btn" id="addExBtn">+ Add exercise</button>
  </div>

  <div id="historyView" style="display:none">
    <div class="subtabs">
      <button id="hEntries" class="active">Entries</button>
      <button id="hProgress">Progress</button>
      <button id="hSessions">Sessions</button>
    </div>
    <div id="entriesPane">
      <div class="toolbar">
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <div id="historyList"></div>
    </div>
    <div id="progressPane" style="display:none">
      <select class="ex-select" id="exerciseSelect"></select>
      <div class="metric-toggle">
        <button id="mTop" class="active">Top weight</button>
        <button id="mVol">Volume</button>
      </div>
      <div id="progressChart"></div>
    </div>
    <div id="sessionsPane" style="display:none">
      <div id="sessionsChart"></div>
    </div>
  </div>
</main>

<footer class="save-bar" id="saveBar">
  <div class="timer-row"><span id="timerLabel">Timer starts on first log</span><span id="timerVal">00:00</span></div>
  <button class="save-btn" id="saveBtn">Save Session</button>
</footer>

<datalist id="exNames"></datalist>

<script>
const KEYS = { plan: "olahtubuh_plan_v1", draft: "olahtubuh_draft_v1", history: "ppl_log_history_v1" };
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").trim().toLowerCase();
const blank = () => ({ w: "", r: "", done: false });
const exName = ex => (ex.name || "").trim() || "Untitled exercise";
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

let warned = false;
function read(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
function write(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) {
    if (!warned) { warned = true; alert("Could not save. Browser storage may be full or blocked."); }
    return false;
  }
}

function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60, p = n => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function fmtNum(v) { return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function fmtLabel(iso) { const [, m, d] = iso.split("-"); return `${+d} ${MONTHS[+m - 1]}`; }

/* ---------- state ---------- */
function defaultPlan() { return { days: ["Chest", "Back", "Legs", "Abs"].map(n => ({ id: uid(), name: n, exercises: [] })) }; }
let plan = read(KEYS.plan, null);
if (!plan || !Array.isArray(plan.days) || !plan.days.length) { plan = defaultPlan(); write(KEYS.plan, plan); }
let draft = read(KEYS.draft, { days: {} });
if (!draft || typeof draft.days !== "object" || !draft.days) draft = { days: {} };
Object.keys(draft.days).forEach(id => { if (!plan.days.some(d => d.id === id)) delete draft.days[id]; });

let currentDayId = plan.days[0].id;
let histTab = "entries";
let metric = "top";

const savePlan = () => write(KEYS.plan, plan);
const saveDraft = () => write(KEYS.draft, draft);
const loadHistory = () => { const h = read(KEYS.history, []); return Array.isArray(h) ? h : []; };
const currentDay = () => plan.days.find(d => d.id === currentDayId) || plan.days[0];

function dayDraft(dayId) {
  if (!draft.days[dayId]) draft.days[dayId] = { date: todayStr(), startedAt: null, sets: {} };
  return draft.days[dayId];
}
function hasData(d) {
  return Object.values(d.sets || {}).some(arr => arr.some(s => s.w !== "" || s.r !== "" || s.done));
}
function ensureSets(day) {
  const d = dayDraft(day.id);
  day.exercises.forEach(ex => {
    if (!d.sets[ex.id]) d.sets[ex.id] = [];
    while (d.sets[ex.id].length < ex.sets) d.sets[ex.id].push(blank());
  });
  return d;
}
function startTimer(d) {
  if (!d.startedAt) { d.startedAt = Date.now(); updateTimer(); }
}

/* ---------- history helpers ---------- */
function chrono() { return loadHistory().slice().reverse().sort((a, b) => String(a.date).localeCompare(String(b.date))); }
function exerciseIndex() {
  const m = new Map();
  chrono().forEach(h => (h.exercises || []).forEach(ex => m.set(norm(ex.name), ex.name)));
  return Array.from(m.entries()).sort((a, b) => a[1].localeCompare(b[1]));
}
function topOf(sets) {
  let best = null;
  sets.forEach(s => {
    const w = parseFloat(s.w);
    if (!isNaN(w) && w > 0 && (!best || w > best.w)) best = { w, r: s.r };
  });
  return best;
}
function lastTop(name) {
  const key = norm(name);
  for (const h of loadHistory()) {
    const ex = (h.exercises || []).find(e => norm(e.name) === key);
    if (ex) { const t = topOf(ex.sets || []); if (t) return t; }
  }
  return null;
}
function progressPoints(key, kind) {
  const pts = [];
  chrono().forEach(h => {
    const ex = (h.exercises || []).find(e => norm(e.name) === key);
    if (!ex) return;
    let value = 0;
    if (kind === "top") {
      const t = topOf(ex.sets || []);
      if (t) value = t.w;
    } else {
      (ex.sets || []).forEach(s => {
        const w = parseFloat(s.w), r = parseFloat(s.r);
        if (!isNaN(w) && !isNaN(r) && w > 0 && r > 0) value += w * r;
      });
    }
    if (value > 0) pts.push({ label: fmtLabel(h.date), value });
  });
  return pts;
}
function refreshDatalist() {
  const names = new Set();
  exerciseIndex().forEach(([, n]) => names.add(n));
  plan.days.forEach(d => d.exercises.forEach(e => { if ((e.name || "").trim()) names.add(e.name.trim()); }));
  $("exNames").innerHTML = Array.from(names).sort().map(n => `<option value="${esc(n)}"></option>`).join("");
}

/* ---------- tabs ---------- */
function renderTabs() {
  $("tabs").innerHTML = plan.days.map(d =>
    `<button class="tab ${d.id === currentDayId ? "active" : ""}" data-day="${esc(d.id)}">${esc(d.name || "Day")}</button>`
  ).join("");
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  currentDayId = b.dataset.day;
  renderTabs();
  if ($("editView").style.display !== "none") renderEdit(); else renderLog();
});

/* ---------- log view ---------- */
function renderLog() {
  const day = currentDay();
  const d = ensureSets(day);
  if (!hasData(d) && !d.startedAt && d.date !== todayStr()) d.date = todayStr();
  $("dateInput").value = d.date;
  if (!day.exercises.length) {
    $("exerciseList").innerHTML = `<div class="empty">No exercises in ${esc(day.name)} yet.<br><button class="primary-link" id="goEdit">Add exercises</button></div>`;
    $("goEdit").onclick = () => showView("edit");
    updateTimer();
    return;
  }
  $("exerciseList").innerHTML = day.exercises.map(ex => {
    const sets = d.sets[ex.id];
    const last = lastTop(ex.name);
    const meta = [`${ex.sets} sets`, (ex.reps || "").trim() ? `${esc(ex.reps)} reps` : null, last ? `last ${fmtNum(last.w)} kg${last.r ? " x " + esc(last.r) : ""}` : null].filter(Boolean).join(" &middot; ");
    const rows = sets.map((s, i) => `
      <div class="set-row" data-ex="${esc(ex.id)}" data-i="${i}">
        <div class="idx">${i + 1}</div>
        <input type="number" inputmode="decimal" placeholder="kg" value="${esc(s.w)}" data-field="w">
        <input type="number" inputmode="numeric" placeholder="reps" value="${esc(s.r)}" data-field="r">
        <button class="done ${s.done ? "checked" : ""}" aria-label="Mark set done"></button>
      </div>`).join("");
    return `
      <div class="exercise-card">
        <div class="exercise-name">${esc(exName(ex))}</div>
        <div class="exercise-meta">${meta}</div>
        <div class="sets-grid">${rows}</div>
        <div class="set-actions">
          <button class="add-set" data-ex="${esc(ex.id)}">+ Set</button>
          <button class="rm-set" data-ex="${esc(ex.id)}">- Set</button>
        </div>
      </div>`;
  }).join("");
  updateTimer();
}
$("exerciseList").addEventListener("input", e => {
  const row = e.target.closest(".set-row");
  if (!row || !e.target.dataset.field) return;
  const d = dayDraft(currentDay().id);
  const s = d.sets[row.dataset.ex] && d.sets[row.dataset.ex][+row.dataset.i];
  if (!s) return;
  s[e.target.dataset.field] = e.target.value;
  if (e.target.value !== "") startTimer(d);
  saveDraft();
});
$("exerciseList").addEventListener("click", e => {
  const d = dayDraft(currentDay().id);
  const done = e.target.closest(".done");
  if (done) {
    const row = done.closest(".set-row");
    const s = d.sets[row.dataset.ex][+row.dataset.i];
    s.done = !s.done;
    done.classList.toggle("checked", s.done);
    if (s.done) startTimer(d);
    saveDraft();
    return;
  }
  const add = e.target.closest(".add-set");
  if (add) { d.sets[add.dataset.ex].push(blank()); saveDraft(); renderLog(); return; }
  const rm = e.target.closest(".rm-set");
  if (rm) {
    const arr = d.sets[rm.dataset.ex];
    if (arr.length > 1) { arr.pop(); saveDraft(); renderLog(); }
  }
});
$("dateInput").addEventListener("change", () => {
  if (!$("dateInput").value) return;
  dayDraft(currentDay().id).date = $("dateInput").value;
  saveDraft();
});
$("clearBtn").onclick = () => {
  const day = currentDay();
  if (!confirm(`Clear the ${day.name} log and reset its timer?`)) return;
  delete draft.days[day.id];
  saveDraft();
  renderLog();
};

/* ---------- timer ---------- */
function updateTimer() {
  const d = draft.days[currentDay().id];
  if (d && d.startedAt) {
    $("timerLabel").textContent = "Session time";
    $("timerVal").textContent = fmtDur((Date.now() - d.startedAt) / 1000);
    $("timerVal").classList.add("live");
  } else {
    $("timerLabel").textContent = "Timer starts on first log";
    $("timerVal").textContent = "00:00";
    $("timerVal").classList.remove("live");
  }
}
setInterval(updateTimer, 1000);

/* ---------- save session ---------- */
$("saveBtn").onclick = () => {
  const day = currentDay();
  const d = dayDraft(day.id);
  const exercises = day.exercises.map(ex => ({
    name: exName(ex),
    sets: (d.sets[ex.id] || []).filter(s => s.w !== "" || s.r !== "" || s.done).map(s => ({ w: s.w, r: s.r, done: s.done }))
  })).filter(ex => ex.sets.length > 0);
  if (!exercises.length) { alert("Log at least one set before saving."); return; }
  const duration = d.startedAt ? Math.max(1, Math.round((Date.now() - d.startedAt) / 1000)) : null;
  const hist = loadHistory();
  hist.unshift({ id: uid(), date: d.date || todayStr(), day: day.name, exercises, duration });
  if (!write(KEYS.history, hist)) return;
  delete draft.days[day.id];
  saveDraft();
  refreshDatalist();
  renderLog();
  $("saveBtn").textContent = duration ? `Saved (${fmtDur(duration)})` : "Saved";
  setTimeout(() => { $("saveBtn").textContent = "Save Session"; }, 2000);
};

/* ---------- edit view ---------- */
function renderEdit() {
  const day = currentDay();
  $("dayName").value = day.name;
  $("editList").innerHTML = day.exercises.map(ex => `
    <div class="edit-card" data-ex="${esc(ex.id)}">
      <div class="edit-row">
        <div class="edit-field">
          <label>Exercise</label>
          <input type="text" list="exNames" data-field="name" value="${esc(ex.name)}" placeholder="Exercise name" autocomplete="off">
        </div>
      </div>
      <div class="edit-row">
        <div class="edit-field sets-field">
          <label>Sets</label>
          <input type="number" inputmode="numeric" min="1" max="20" data-field="sets" value="${ex.sets}">
        </div>
        <div class="edit-field">
          <label>Reps / target</label>
          <input type="text" data-field="reps" value="${esc(ex.reps)}" placeholder="e.g. 8-12" autocomplete="off">
        </div>
        <button class="icon-btn" data-act="up" aria-label="Move up">&#9650;</button>
        <button class="icon-btn" data-act="down" aria-label="Move down">&#9660;</button>
        <button class="icon-btn danger" data-act="del" aria-label="Remove">&times;</button>
      </div>
    </div>`).join("");
}
$("dayName").addEventListener("input", () => {
  currentDay().name = $("dayName").value;
  savePlan();
  renderTabs();
});
$("dayName").addEventListener("blur", () => {
  const day = currentDay();
  if (!day.name.trim()) { day.name = "Day"; $("dayName").value = day.name; savePlan(); renderTabs(); }
});
$("editList").addEventListener("input", e => {
  const card = e.target.closest(".edit-card"); if (!card) return;
  const day = currentDay();
  const ex = day.exercises.find(x => x.id === card.dataset.ex); if (!ex) return;
  const field = e.target.dataset.field;
  if (field === "sets") {
    const n = parseInt(e.target.value, 10);
    if (isNaN(n) || n < 1 || n > 20) return;
    ex.sets = n;
    // keep what has been logged: pad with blanks, only trim empty rows from the end
    const arr = dayDraft(day.id).sets[ex.id] || (dayDraft(day.id).sets[ex.id] = []);
    while (arr.length < n) arr.push(blank());
    while (arr.length > n) {
      const last = arr[arr.length - 1];
      if (last.w !== "" || last.r !== "" || last.done) break;
      arr.pop();
    }
    saveDraft();
  } else if (field === "name" || field === "reps") {
    ex[field] = e.target.value;
  }
  savePlan();
});
$("editList").addEventListener("change", refreshDatalist);
$("editList").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const day = currentDay();
  const id = btn.closest(".edit-card").dataset.ex;
  const i = day.exercises.findIndex(x => x.id === id); if (i < 0) return;
  const act = btn.dataset.act;
  if (act === "up" && i > 0) { [day.exercises[i - 1], day.exercises[i]] = [day.exercises[i], day.exercises[i - 1]]; }
  else if (act === "down" && i < day.exercises.length - 1) { [day.exercises[i + 1], day.exercises[i]] = [day.exercises[i], day.exercises[i + 1]]; }
  else if (act === "del") {
    const d = dayDraft(day.id);
    const logged = (d.sets[id] || []).some(s => s.w !== "" || s.r !== "" || s.done);
    if (logged && !confirm(`${exName(day.exercises[i])} has sets logged in the current log. Remove it and clear those sets?`)) return;
    day.exercises.splice(i, 1);
    delete d.sets[id];
    saveDraft();
  } else return;
  savePlan();
  renderEdit();
});
$("addExBtn").onclick = () => {
  currentDay().exercises.push({ id: uid(), name: "", sets: 3, reps: "" });
  savePlan();
  renderEdit();
  const inputs = $("editList").querySelectorAll('input[data-field="name"]');
  if (inputs.length) inputs[inputs.length - 1].focus();
};
$("addDayBtn").onclick = () => {
  const day = { id: uid(), name: "New day", exercises: [] };
  plan.days.push(day);
  currentDayId = day.id;
  savePlan();
  renderTabs();
  renderEdit();
  $("dayName").focus();
  $("dayName").select();
};
$("delDayBtn").onclick = () => {
  if (plan.days.length <= 1) { alert("Keep at least one day."); return; }
  const day = currentDay();
  if (!confirm(`Delete ${day.name} and its exercises? Saved history is not affected.`)) return;
  plan.days = plan.days.filter(d => d.id !== day.id);
  delete draft.days[day.id];
  currentDayId = plan.days[0].id;
  savePlan();
  saveDraft();
  renderTabs();
  renderEdit();
};

/* ---------- history ---------- */
function renderHistory() {
  const hist = loadHistory();
  if (!hist.length) { $("historyList").innerHTML = `<div class="empty">No sessions logged yet.</div>`; return; }
  $("historyList").innerHTML = hist.map(h => `
    <div class="history-entry">
      <div class="hd">
        <span>${esc(h.date)}</span>
        <span>${h.duration ? `<span class="chip">${fmtDur(h.duration)}</span> ` : ""}<span class="day-tag">${esc(h.day)}</span></span>
      </div>
      <table>
        ${(h.exercises || []).map(ex => `
          <tr><td colspan="2" style="padding-top:6px;font-weight:600">${esc(ex.name)}</td></tr>
          ${(ex.sets || []).map(s => `<tr><td style="color:var(--text-dim)">Set</td><td>${esc(s.w || "-")} kg x ${esc(s.r || "-")} ${s.done ? "&#10003;" : ""}</td></tr>`).join("")}
        `).join("")}
      </table>
      <button class="del" data-id="${esc(h.id)}">Delete</button>
    </div>`).join("");
}
$("historyList").addEventListener("click", e => {
  const b = e.target.closest(".del"); if (!b) return;
  if (!confirm("Delete this session?")) return;
  write(KEYS.history, loadHistory().filter(h => String(h.id) !== b.dataset.id));
  renderHistory();
});

function buildChart(points, fmtY) {
  const n = points.length;
  const h = 240, padL = 42, padR = 14, padT = 18, padB = 32;
  const w = Math.max(340, n * 46 + padL + padR);
  const cw = w - padL - padR, ch = h - padT - padB;
  const vals = points.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => n > 1 ? padL + (i * cw) / (n - 1) : padL + cw / 2;
  const y = v => padT + ch - ((v - lo) / (hi - lo)) * ch;
  let svg = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4, yy = y(v);
    svg += `<line class="chart-grid" x1="${padL}" y1="${yy}" x2="${w - padR}" y2="${yy}"/>`;
    svg += `<text class="chart-axis-label" x="${padL - 6}" y="${yy + 3}" text-anchor="end">${fmtY(v, hi - lo)}</text>`;
  }
  svg += `<path class="chart-line" d="${points.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.value)}`).join(" ")}"/>`;
  points.forEach((p, i) => {
    svg += `<circle class="chart-point" cx="${x(i)}" cy="${y(p.value)}" r="3.5"/>`;
    svg += `<text class="chart-value" x="${x(i)}" y="${y(p.value) - 9}">${fmtNum(Math.round(p.value * 10) / 10)}</text>`;
    svg += `<text class="chart-axis-label" x="${x(i)}" y="${h - 10}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<div class="chart-card"><svg viewBox="0 0 ${w} ${h}" style="min-width:${w <= 360 ? 0 : w}px" xmlns="http://www.w3.org/2000/svg">${svg}</svg></div>`;
}
function statsHTML(items) {
  return `<div class="chart-stats">${items.map(i => `<div class="chart-stat"><div class="v">${i.v}</div><div class="l">${i.l}</div></div>`).join("")}</div>`;
}
function scrollChartsToEnd() { document.querySelectorAll(".chart-card").forEach(c => { c.scrollLeft = c.scrollWidth; }); }

function renderProgress() {
  const idx = exerciseIndex();
  const sel = $("exerciseSelect");
  const prev = sel.value;
  if (!idx.length) {
    sel.style.display = "none";
    $("progressChart").innerHTML = `<div class="empty">Save a session with weights to see progress here.</div>`;
    return;
  }
  sel.style.display = "block";
  sel.innerHTML = idx.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join("");
  sel.value = idx.some(([k]) => k === prev) ? prev : idx[0][0];
  renderProgressChart();
}
function renderProgressChart() {
  const pts = progressPoints($("exerciseSelect").value, metric);
  if (!pts.length) {
    $("progressChart").innerHTML = `<div class="empty">No weight logged for this exercise yet. Bodyweight-only sets are not charted.</div>`;
    return;
  }
  const first = pts[0].value, last = pts[pts.length - 1].value, best = Math.max(...pts.map(p => p.value));
  const delta = last - first, unit = metric === "top" ? " kg" : "";
  $("progressChart").innerHTML =
    statsHTML([{ v: fmtNum(Math.round(last * 10) / 10) + unit, l: "Latest" }, { v: fmtNum(Math.round(best * 10) / 10) + unit, l: "Best" }, { v: (delta > 0 ? "+" : "") + fmtNum(Math.round(delta * 10) / 10) + unit, l: "Change" }]) +
    buildChart(pts, (v, range) => range < 6 ? v.toFixed(1) : String(Math.round(v)));
  scrollChartsToEnd();
}
function renderSessions() {
  const items = chrono().filter(h => h.duration > 0);
  if (!items.length) {
    $("sessionsChart").innerHTML = `<div class="empty">Session lengths show up here after you save a session with the timer running.</div>`;
    return;
  }
  const secs = items.map(h => h.duration);
  const avg = secs.reduce((a, b) => a + b, 0) / secs.length;
  const pts = items.map(h => ({ label: fmtLabel(h.date), value: h.duration / 60 }));
  $("sessionsChart").innerHTML =
    statsHTML([{ v: String(items.length), l: "Sessions" }, { v: fmtDur(avg), l: "Average" }, { v: fmtDur(Math.max(...secs)), l: "Longest" }]) +
    `<div class="exercise-meta" style="margin:0 2px 8px">Minutes per session</div>` +
    buildChart(pts, (v, range) => range < 6 ? v.toFixed(1) : String(Math.round(v)));
  scrollChartsToEnd();
}
function showHist(tab) {
  histTab = tab;
  $("hEntries").classList.toggle("active", tab === "entries");
  $("hProgress").classList.toggle("active", tab === "progress");
  $("hSessions").classList.toggle("active", tab === "sessions");
  $("entriesPane").style.display = tab === "entries" ? "block" : "none";
  $("progressPane").style.display = tab === "progress" ? "block" : "none";
  $("sessionsPane").style.display = tab === "sessions" ? "block" : "none";
  if (tab === "entries") renderHistory();
  if (tab === "progress") renderProgress();
  if (tab === "sessions") renderSessions();
}
$("hEntries").onclick = () => showHist("entries");
$("hProgress").onclick = () => showHist("progress");
$("hSessions").onclick = () => showHist("sessions");
$("exerciseSelect").onchange = renderProgressChart;
$("mTop").onclick = () => { metric = "top"; $("mTop").classList.add("active"); $("mVol").classList.remove("active"); renderProgressChart(); };
$("mVol").onclick = () => { metric = "volume"; $("mVol").classList.add("active"); $("mTop").classList.remove("active"); renderProgressChart(); };

/* ---------- export / import ---------- */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 2, history: loadHistory(), plan }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `olahtubuh-export-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.history;
      if (!Array.isArray(incoming)) throw new Error("bad format");
      const existing = loadHistory();
      const ids = new Set(existing.map(h => String(h.id)));
      write(KEYS.history, existing.concat(incoming.filter(h => !ids.has(String(h.id)))));
      const planEmpty = plan.days.every(d => !d.exercises.length);
      if (!Array.isArray(data) && data.plan && Array.isArray(data.plan.days) && data.plan.days.length && planEmpty) {
        plan = data.plan; currentDayId = plan.days[0].id; savePlan(); renderTabs();
      }
      refreshDatalist();
      renderHistory();
      alert("Import complete.");
    } catch (err) {
      alert("Could not read that file. Use an export from this app.");
    }
    $("importFile").value = "";
  };
  reader.readAsText(file);
};

/* ---------- navigation ---------- */
function showView(name) {
  $("btnLog").classList.toggle("active", name === "log");
  $("btnEdit").classList.toggle("active", name === "edit");
  $("btnHistory").classList.toggle("active", name === "history");
  $("logView").style.display = name === "log" ? "block" : "none";
  $("editView").style.display = name === "edit" ? "block" : "none";
  $("historyView").style.display = name === "history" ? "block" : "none";
  $("saveBar").style.display = name === "log" ? "block" : "none";
  $("tabs").style.display = name === "history" ? "none" : "flex";
  if (name === "log") renderLog();
  if (name === "edit") renderEdit();
  if (name === "history") showHist(histTab);
}
$("btnLog").onclick = () => showView("log");
$("btnEdit").onclick = () => showView("edit");
$("btnHistory").onclick = () => showView("history");

/* ---------- init ---------- */
refreshDatalist();
renderTabs();
showView("log");
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
